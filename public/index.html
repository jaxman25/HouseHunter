<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#1B6EF3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>%WEB_TITLE%</title>
    <!--
      The single global web stylesheet: the react-native-web root reset plus
      web-only concerns (design tokens, autofill normalisation, focus
      visibility). Lives in public/ so Expo copies it verbatim to the build
      root; see public/web-styles.css for the documentation.

      Kept as a render-blocking <link> (not a deferred script) so the reset
      and tokens apply before first paint.

      ⚠️ Bump ?v= whenever web-styles.css changes: public/sw.js caches
      same-origin assets stale-while-revalidate keyed on the full URL, so an
      unversioned URL would be served one load behind after a deploy.
    -->
    <link rel="stylesheet" href="/web-styles.css?v=3" />
    <style>
      /*
        Web boot splash: shown before the JS bundle finishes loading (and
        before React can render AppStartLoader). The artwork is the same
        animated SVG used by AppStartLoader, so the hand-off is seamless.
        React replaces #root's contents on mount; the small observer below
        removes the splash if the renderer appends instead of replacing.
      */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #061023;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #061023;
      }
      #boot-splash img {
        display: block;
        width: 84vw;
        max-width: 280px;
        height: auto;
      }
    </style>
    <script>
      // Register the service worker for offline support (see /sw.js).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (registration) {
              console.log('Service Worker registered:', registration.scope);
            })
            .catch(function (error) {
              console.warn('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <!-- Shown until the JS bundle mounts the React tree. -->
      <div id="boot-splash" role="img" aria-label="Ascend Hunters">
        <img src="/loader-anime.svg" alt="" />
      </div>
    </div>
    <script>
      // Remove the static boot splash as soon as React renders a child that
      // is not the splash (whether it replaces #root's children or appends).
      (function () {
        var root = document.getElementById('root');
        if (!root) return;
        var observer = new MutationObserver(function () {
          var appMounted = Array.prototype.some.call(root.children, function (child) {
            return child.id !== 'boot-splash';
          });
          if (!appMounted) return;
          observer.disconnect();
          var splash = document.getElementById('boot-splash');
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        });
        observer.observe(root, { childList: true });
      })();
    </script>
  </body>
</html>
